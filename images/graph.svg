<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">AlgoNote graph mark</title>
  <desc id="desc">A compact graph network mark with connected vertices.</desc>
  <defs>
    <linearGradient id="edgeGradient" x1="20" y1="108" x2="108" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f3437"/>
      <stop offset="0.52" stop-color="#5b6562"/>
      <stop offset="1" stop-color="#1f2427"/>
    </linearGradient>
    <linearGradient id="nodeGradient" x1="28" y1="104" x2="104" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111315"/>
      <stop offset="1" stop-color="#49504d"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#111315" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#f6f6f4"/>
  <path d="M34 91L58 36L92 92M34 91L92 92M58 36L77 64L34 91M77 64L92 92" fill="none" stroke="url(#edgeGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#softShadow)">
    <circle cx="58" cy="36" r="13" fill="url(#nodeGradient)"/>
    <circle cx="77" cy="64" r="11" fill="#f6f6f4" stroke="#24282a" stroke-width="7"/>
    <circle cx="34" cy="91" r="13" fill="url(#nodeGradient)"/>
    <circle cx="92" cy="92" r="13" fill="url(#nodeGradient)"/>
  </g>
</svg>
